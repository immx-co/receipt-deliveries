name: receipt-deliveries

services:
  postgres:
    image: postgres:17-alpine
    container_name: receipt-deliveries-postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5454}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-receipt_deliveries}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    image: ghcr.io/immx-co/receipt-deliveries-backend:${APP_VERSION:-1.1.0}
    container_name: receipt-deliveries-backend

    ports:
      - "3100:3100"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-receipt_deliveries}
      DB_USERNAME: ${POSTGRES_USER:-user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  frontend:
    image: ghcr.io/immx-co/receipt-deliveries-frontend:${APP_VERSION:-1.1.0}
    container_name: receipt-deliveries-frontend

    ports:
      - "3200:3200"

    environment:
      BACKEND_URL: http://backend:3100
      VAADIN_LAUNCH_BROWSER: "false"

    depends_on:
      backend:
        condition: service_started

    restart: unless-stopped

volumes:
  postgres-data: