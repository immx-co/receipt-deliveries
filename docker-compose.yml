name: receipt-deliveries

services:
  postgres:
    image: postgres:17-alpine
    container_name: receipt-deliveries-postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5454}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: receipt-deliveries-backend/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}

    image: receipt-deliveries-backend:${APP_VERSION:-dev}
    container_name: receipt-deliveries-backend

    ports:
      - "3100:3100"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres-data: